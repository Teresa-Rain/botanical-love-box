<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For You, Bubbi · The Love Box</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Special+Elite&display=swap" rel="stylesheet"><style>
:root{--forest:#203623;--olive:#40583b;--sage:#88977c;--stone:#d5cac1;--ivory:#f3e7d8;--gold:#ad9466;--ink:#253729}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 52% 38%,#faf8f2,#edeae1 76%);font-family:'Special Elite',monospace;min-height:100vh}button{font:inherit}main{max-width:1060px;margin:auto;padding:35px 16px 48px;text-align:center}.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#788474}.heading{font:italic clamp(43px,7vw,68px)/1.1 'Cormorant Garamond',serif;margin:13px 0 10px;font-weight:400}.rule{height:1px;width:120px;background:var(--gold);margin:20px auto}.stage{position:relative;width:min(94vw,800px);height:min(78vw,690px);min-height:465px;margin:24px auto 4px;perspective:1000px;isolation:isolate}.ground{position:absolute;left:50%;top:54%;width:48%;height:13%;border-radius:50%;background:#20362322;filter:blur(28px);transform:translate(-50%,-50%)}.pentagon{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.bodyplate{fill:#d2bea0;stroke:#a8916b;stroke-width:2;filter:drop-shadow(0 12px 9px #26372a26)}.inside{fill:#e9d9c2;stroke:#bfa880;stroke-width:1.4}.fold{fill:#f4e9d8;stroke:#b9a278;stroke-width:1.5;transform-box:view-box;transition:transform 1.15s cubic-bezier(.21,.85,.25,1),filter .9s;filter:drop-shadow(0 5px 6px #2336292a)}.fold .detail{stroke:#d0bea0;stroke-width:.75;fill:none}.panelbutton{pointer-events:none;cursor:pointer}.opened .panelbutton{pointer-events:auto}.panelbutton text{opacity:0;transition:opacity .45s .65s}.opened .panelbutton text{opacity:1}.labeltext{font:italic 19px 'Cormorant Garamond',serif;fill:#344936;text-anchor:middle;pointer-events:none}.labelsmall{font:8px 'Special Elite',monospace;fill:#687467;text-anchor:middle;pointer-events:none}.lid{position:absolute;left:50%;top:50%;width:260px;height:247px;border:0;color:var(--ivory);cursor:pointer;z-index:6;transform:translate(-50%,-50%);transition:transform 1.05s cubic-bezier(.2,.8,.25,1),opacity .6s,filter .8s;filter:drop-shadow(0 15px 13px #182c1c63);background:linear-gradient(140deg,#597057 0%,#2a482f 43%,#182c20 100%);clip-path:polygon(50% 0%,97.55% 34.55%,79.39% 90.45%,20.61% 90.45%,2.45% 34.55%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px}.lid:before{content:"";position:absolute;inset:12px;border:1px solid #d2bc80;clip-path:polygon(50% 0%,97.55% 34.55%,79.39% 90.45%,20.61% 90.45%,2.45% 34.55%);opacity:.6}.lid .lid-title{font:italic 34px 'Cormorant Garamond',serif}.lid .lid-kicker{font:9px 'Special Elite',monospace;letter-spacing:.16em}.lid .gold{color:#ceb987;font:21px 'Cormorant Garamond',serif}.lid.lift{transform:translate(-50%,-125%) rotate(-10deg) scale(.82);opacity:0;pointer-events:none;filter:drop-shadow(0 24px 11px #182c1c30)}.opening{position:absolute;left:50%;top:50%;width:min(335px,74vw);transform:translate(-50%,-50%) rotate(-3deg) scale(.93);background:#f8efe3;border:1px solid var(--gold);box-shadow:0 16px 30px #263d2e38;padding:28px 22px;opacity:0;pointer-events:none;z-index:5;transition:opacity .55s,transform .65s;cursor:pointer}.cardready .opening{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}.opening.removed{opacity:0;transform:translate(65%,-170%) rotate(16deg) scale(.7);pointer-events:none}.opening h2{font:italic 37px 'Cormorant Garamond',serif;font-weight:400;margin:0 0 12px}.opening p{font-size:12px;line-height:1.85;margin:0 0 18px}.opening span{font-size:10px;color:#87765d}.hingepath{stroke:#ad936d;stroke-width:2;fill:none;stroke-dasharray:4 3}.base-words{fill:#7d715b;font:italic 17px 'Cormorant Garamond',serif;text-anchor:middle}.folds{opacity:0;transition:opacity .3s}.opened .folds{opacity:1}.fold{transform:rotate(0deg)}.opened .fold{transform:rotate(var(--degrees))}.panelbutton:focus-visible polygon{stroke:#745624;stroke-width:4}.foot{color:#697665;font-size:10px;line-height:1.7;margin:14px auto 0;max-width:420px}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#162b21cf;align-items:center;justify-content:center;padding:20px}.overlay.visible{display:flex}.paper{position:relative;width:min(490px,100%);max-height:83vh;overflow-y:auto;background:#fbf3e6;border:1px solid var(--gold);padding:32px 35px;text-align:left;box-shadow:0 18px 60px #0e1b1380}.paper h2{font:italic 40px 'Cormorant Garamond',serif;margin:0 0 14px}.paper p{font-size:13px;line-height:1.9}.close{display:block;margin:20px 0 0 auto;border:1px solid var(--gold);background:var(--forest);color:#fff;padding:11px 18px;cursor:pointer}.restart{background:none;border:1px solid #b4aa91;color:#435646;font-size:10px;padding:9px 16px;cursor:pointer;margin-top:15px}.tiny-flora{position:absolute;width:20px;height:20px;left:18%;top:18%;opacity:.55;transform:rotate(-35deg);border-left:1px solid #80947b}.tiny-flora:before,.tiny-flora:after{content:"";position:absolute;background:#87977b;border-radius:100% 0;width:9px;height:5px;left:-9px;top:5px}.tiny-flora:after{left:0;top:12px;transform:scaleX(-1)}
@media(max-width:650px){main{padding-top:25px}.stage{width:94vw;height:570px;min-height:0}.pentagon{overflow:visible}.lid{width:178px;height:168px}.lid .lid-title{font-size:27px}.lid .lid-kicker{font-size:7px}.opening{padding:23px 16px}.opening h2{font-size:32px}.paper{padding:27px 23px}.paper h2{font-size:33px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style></head><body><main><div class="eyebrow">a little something, just for you</div><h1 class="heading">Our Little Story</h1><div class="rule"></div><div class="eyebrow">Layer One · Meeting You</div>
<div class="stage" id="stage"><div class="ground"></div><div class="tiny-flora" aria-hidden="true"></div>
<!-- Every flap below is a polygon with its inner edge on the pentagon perimeter. Animation rotates around the shared hinge line in the SVG coordinate plane. -->
<svg class="pentagon" id="scene" viewBox="0 0 800 690" role="group" aria-label="An unfolding five-sided keepsake box">
<defs><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity="0.13"/></filter></defs>
<g class="folds" id="folds"></g>
<polygon class="bodyplate" points="400,210 580.7,341.3 511.7,553.7 288.3,553.7 219.3,341.3"/>
<polygon class="inside" points="400,222 569.3,345 504.6,543 295.4,543 230.7,345"/>
<text class="base-words" x="400" y="386">a little piece of my heart</text><text class="base-words" x="400" y="414">for you, always</text>
</svg>
<button class="lid" id="lid" aria-label="Lift the lid of the keepsake box"><span class="lid-kicker">FOR YOU, BUBBI</span><span class="lid-title">with love</span><span class="gold">✧</span></button>
<button class="opening" id="opening" aria-label="Read the opening card and unfold layer one"><h2>Meeting You</h2><p>“Where'd you get that?”<br>“I feel like this is a trap… but where'd I get what?”<br>“Your smile. It's pretty.”</p><span>tap to set this card aside</span></button>
</div><p class="foot" id="hint">Tap the green lid to lift it.</p><button class="restart" id="restart">Close the box ↺</button></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="paperTitle"><article class="paper"><h2 id="paperTitle"></h2><p id="paperBody"></p><button class="close" id="close">Close ×</button></article></div>
<script>
const stage=document.querySelector('#stage'),lid=document.querySelector('#lid'),opening=document.querySelector('#opening'),folds=document.querySelector('#folds'),overlay=document.querySelector('#overlay'),hint=document.querySelector('#hint');
const center={x:400,y:390};const vertices=[[400,210],[580.7,341.3],[511.7,553.7],[288.3,553.7],[219.3,341.3]];
const items=[
['The Boy Behind','the Profile','A tiny envelope','This will become the envelope with his original profile photo and your very excited reaction to it.'],
['Hide & Seek','','Your drawing','This panel will reveal your actual dryer drawing—not a replacement illustration.'],
['You Made','Talking Easy','A pull-out note','Your own words about how effortlessly he made conversation feel, and how frightening it was to want to be known.'],
['Our Little','Timeline','A folded strip','June 14 · First chat\nJune 20 · I knew you were different\nJuly 12 · I decided to risk falling\nJuly 18 · You asked me to be yours'],
['The Questions','That Drew Me In','A paper accordion','What’s your dream?\nWhat turns you on and off?\nDo you want a big family?\nCan we make Wasian babies?']
];
// Project each flap outward from its hinged edge. All shapes remain connected even on a narrow display.
const flapPolys=[];
vertices.forEach((a,i)=>{
 const b=vertices[(i+1)%5];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;let nx=mx-center.x,ny=my-center.y;const len=Math.hypot(nx,ny);nx/=len;ny/=len;
 const depth=142;const ox=nx*depth,oy=ny*depth;
 const p1=[a[0]+ox,a[1]+oy],p2=[b[0]+ox,b[1]+oy];
 const makePoints=(fraction)=>[a,b,[b[0]+ox*fraction,b[1]+oy*fraction],[a[0]+ox*fraction,a[1]+oy*fraction]].map(pt=>pt.join(',')).join(' ');
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','panelbutton');g.setAttribute('role','button');g.setAttribute('tabindex','-1');g.setAttribute('aria-label',items[i][0]+' '+items[i][1]);
 const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');poly.setAttribute('points',makePoints(0.015));flapPolys.push({poly,makePoints});poly.setAttribute('class','fold');
 // This first iteration uses the same edge shape on every flap, already opened. Keep labels level for readability.
 const decorative=document.createElementNS('http://www.w3.org/2000/svg','line');decorative.setAttribute('class','hingepath');decorative.setAttribute('x1',a[0]);decorative.setAttribute('y1',a[1]);decorative.setAttribute('x2',b[0]);decorative.setAttribute('y2',b[1]);
 const tx=mx+nx*76,ty=my+ny*76;
 function t(str,y,sizeClass){const el=document.createElementNS('http://www.w3.org/2000/svg','text');el.setAttribute('x',tx);el.setAttribute('y',y);el.setAttribute('class',sizeClass);el.textContent=str;return el}
 g.append(poly,decorative,t(items[i][0],ty-5,'labeltext'),t(items[i][1],ty+17,'labeltext'),t(items[i][2],ty+36,'labelsmall'));
 g.addEventListener('click',()=>show(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}});folds.append(g);
});
function animateFlaps(open){const beginning=performance.now(),length=1150;function frame(now){const progress=Math.min(1,(now-beginning)/length);flapPolys.forEach((f,i)=>{const t=Math.max(0,Math.min(1,(progress-i*.085)/.66));const eased=1-Math.pow(1-t,3);f.poly.setAttribute('points',f.makePoints(open?Math.max(.015,eased):Math.max(.015,1-eased)))});if(progress<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function show(i){document.querySelector('#paperTitle').textContent=items[i][0]+' '+items[i][1];document.querySelector('#paperBody').textContent=items[i][3];document.querySelector('#paperBody').style.whiteSpace='pre-line';overlay.classList.add('visible');document.querySelector('#close').focus()}
let phase=0;
lid.addEventListener('click',()=>{if(phase!==0)return;phase=1;lid.classList.add('lift');hint.textContent='Tap the opening card to unfold the first layer.';setTimeout(()=>{if(phase===1)stage.classList.add('cardready')},500)});
opening.addEventListener('click',()=>{if(phase!==1)return;phase=2;opening.classList.add('removed');stage.classList.add('opened');animateFlaps(true);folds.querySelectorAll('.panelbutton').forEach(g=>g.setAttribute('tabindex','0'));hint.textContent='Five attached paper flaps. Tap one to inspect its keepsake.'});
function reset(){animateFlaps(false);phase=0;stage.classList.remove('opened','cardready');opening.classList.remove('removed');lid.classList.remove('lift');folds.querySelectorAll('.panelbutton').forEach(g=>g.setAttribute('tabindex','-1'));hint.textContent='Tap the green lid to lift it.'}document.querySelector('#restart').onclick=reset;
function close(){overlay.classList.remove('visible')}document.querySelector('#close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
